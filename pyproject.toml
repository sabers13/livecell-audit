[project]
name = "livecell-audit"
version = "0.1.0"
description = "A reproducible data-quality pipeline, benchmark audit, and reporting dashboard for Sartorius LIVECell dataset"
authors = [{ name = "Saber Sojudi", email = "contact@sabersojudi.com" }]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
