[project]
name = "livecell-audit"
version = "0.1.0"
description = "A reproducible data-quality audit, DuckDB warehouse, feature analysis and review ranking for the Sartorius LIVECell dataset"
authors = [{ name = "Saber Sojudi", email = "contact@sabersojudi.com" }]
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "duckdb>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=3.0.0",
    "scikit-learn>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
